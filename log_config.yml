version: 1
disable_existing_loggers: false

formatters:
  standard:
    format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

handlers:
  console:
    class: logging.StreamHandler
    level: WARNING
    formatter: standard

  file:
    class: logging.handlers.RotatingFileHandler
    level: INFO
    formatter: standard
    filename: internal/jat.log
    maxBytes: 2000000
    backupCount: 5
    encoding: utf8

root:
  level: DEBUG
  handlers: [console, file]
